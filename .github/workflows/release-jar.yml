name: Release JAR

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-eligibility:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.eligibility.outputs.should-release }}

    steps:
      - name: Skip releases for Dependabot and norelease pull requests
        id: eligibility
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.after
            });
            const isDependabot = context.actor === 'dependabot[bot]'
              || pullRequests.some((pullRequest) => pullRequest.user?.login === 'dependabot[bot]');
            const hasNoReleaseBranch = pullRequests.some((pullRequest) =>
              pullRequest.head.ref === 'norelease' || pullRequest.head.ref.startsWith('norelease/')
            );
            const shouldRelease = !isDependabot && !hasNoReleaseBranch;
            core.setOutput('should-release', String(shouldRelease));
            core.info(shouldRelease ? 'Release is eligible.' : 'Skipping non-release change.');

  release:
    needs: release-eligibility
    if: needs.release-eligibility.outputs.should-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine next release version
        id: version
        run: |
          release_minor="2.2"
          last_tag="$(git tag -l "v${release_minor}.*" --sort=-version:refname | head -n 1)"
          if [ -z "$last_tag" ]; then
            next_patch=0
          else
            current_patch="${last_tag#v${release_minor}.}"
            next_patch=$((current_patch + 1))
          fi
          version="${release_minor}.${next_patch}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build release JARs
        run: mvn -B -Drevision=${{ steps.version.outputs.version }} clean package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" \
              "storyteller-cli/target/storyteller-cli-${{ steps.version.outputs.version }}-all.jar" \
              "storyteller-api/target/storyteller-api-${{ steps.version.outputs.version }}-all.jar" \
              --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "storyteller-cli/target/storyteller-cli-${{ steps.version.outputs.version }}-all.jar" \
              "storyteller-api/target/storyteller-api-${{ steps.version.outputs.version }}-all.jar" \
              --target "${GITHUB_SHA}" \
              --title "${{ steps.version.outputs.tag }}" \
              --generate-notes
          fi
