<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storyteller</title>
    <script src="story-theme.js"></script>
    <link rel="stylesheet" href="storyteller.css">
    <link rel="stylesheet" href="demo.css">
    <script src="demo.js" defer></script>
  </head>
  <body>
    <p class="demo-notice" role="note">Demo · Sample data · No AI or server connection</p>
    <main class="start-page">
      <section class="panel start-panel">
        <p class="eyebrow">Local AI storytelling</p>
        <h1>Storyteller</h1>
        <p class="intro">Try the Storyteller interface. Every prompt receives a fixed demo reply.</p>
        <form id="start-demo" action="story.html" method="get" class="stack">
          <label for="title">Story title <span>(optional)</span></label>
          <input id="title" name="title" maxlength="255" autocomplete="off" autofocus>
          <button type="submit">Start a story</button>
        </form>
        <div class="start-divider"><span>or</span></div>
        <form method="post" action="#" data-inactive class="stack">
          <label for="sessionId">Resume an infinite session <span>(session ID)</span></label>
          <input id="sessionId" name="sessionId" maxlength="36" autocomplete="off" required>
          <button type="submit" class="secondary-action" disabled title="Unavailable in the demo">Resume session</button>
        </form>
        <div class="start-divider"><span>or</span></div>
        <form method="post" action="#" data-inactive enctype="multipart/form-data" class="stack import-form">
          <label for="bundle">Import CLI session <span>(ZIP)</span></label>
          <input id="bundle" name="bundle" type="file" accept=".zip,application/zip" required disabled>
          <button type="submit" class="secondary-action" disabled title="Unavailable in the demo">Import session</button>
        </form>
      </section>
    </main>
  </body>
</html>
